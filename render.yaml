services:
  - type: web
    name: sri-lakshmi-sarees-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Email Notification Providers (Resend recommended for Render HTTPS)
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        value: bhavanivejandla6@gmail.com
      - key: EMAIL_FROM
        value: "Sri Lakshmi Sarees <onboarding@resend.dev>"
      # Direct SMTP (Local dev fallback)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Admin Credentials
      - key: ADMIN_EMAIL
        value: admin@srilakshmisarees.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
